# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New > Blueprint > select this repo. It reads this
# file and creates the service below. You'll be prompted to fill in the
# envVars marked `sync: false` (API keys etc.) — never commit those values.
#
# Storage note: this starts on the free plan, which has an ephemeral
# filesystem — your data (profile, food log, login) is wiped on every
# redeploy. To make it durable, upgrade the `plan` below to `starter` (or
# higher) and uncomment the `disk` block, which mounts a persistent volume at
# DATA_DIR. See README.md "Deploy to Render" for details.
services:
  - type: web
    name: healthy-weight-coach
    runtime: node
    plan: free
    branch: main
    # --include=dev on the frontend install: NODE_ENV=production below (set
    # for the running service) also applies during the build step, which
    # makes plain `npm install` skip devDependencies — including vite itself,
    # which lives there. Confirmed live on Render: build failed with
    # "sh: 1: vite: not found" without this flag.
    buildCommand: npm --prefix backend install && npm --prefix frontend install --include=dev && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # DATA_DIR intentionally omitted on the free plan: /var/data only
      # becomes writable once the `disk` block below is uncommented (which
      # requires a paid plan) — confirmed live as EACCES: permission denied
      # otherwise. Without it, db.js falls back to a directory inside the
      # app itself, which is always writable but wiped on every redeploy
      # (same ephemeral-storage caveat as the free plan generally). Add
      # DATA_DIR back, set to /var/data, once the disk block is enabled.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      # Only needed if you use Google Fit sync / Google Drive backup — see
      # README.md setup sections for how to get these. Leave blank otherwise.
      - key: GOOGLE_FIT_CLIENT_ID
        sync: false
      - key: GOOGLE_FIT_CLIENT_SECRET
        sync: false
      - key: GOOGLE_FIT_REDIRECT_URI
        sync: false
      - key: GOOGLE_DRIVE_REDIRECT_URI
        sync: false
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1

  - type: web
    name: threshold-business-site
    runtime: node
    plan: free
    branch: main
    rootDir: business-site
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ADMIN_KEY
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Threshold <onboarding@resend.dev>"
    # Free plan has an ephemeral filesystem — data/reports.json resets on
    # every redeploy. Not critical here since every report is also emailed
    # via Resend at the time it's generated; upgrade to `starter` and add a
    # disk block (see the service above) if you want the admin page's
    # history to survive redeploys too.
